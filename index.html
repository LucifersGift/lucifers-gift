<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucifers Gift</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#f0f0f0;max-width:520px;margin:0 auto;padding:20px;line-height:1.5}
    h1{color:#f7931a;text-align:center}
    button{background:#f7931a;color:#000;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:bold;width:100%;margin:8px 0}
    .box{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:16px;margin-top:20px}
    .warning{background:#2a1f12;border:1px solid #f7931a;color:#ffcc99;padding:14px;border-radius:8px;margin:18px 0}
    .seed{background:#111;padding:14px;border-radius:6px;margin:12px 0;font-size:15px;line-height:1.6;word-spacing:3px}
  </style>
</head>
<body>
  <h1>Lucifers Gift</h1>
  <p style="text-align:center;opacity:0.7">Bitcoin Wallet • Client-side only</p>

  <div class="warning">
    <strong>Security Warning</strong><br>
    This generates a seed phrase on your device only.<br>
    Never share it. Write it down offline.<br>
    Use only small test amounts.
  </div>

  <button onclick="generateWallet()">Generate 24-Word Seed</button>
  <button onclick="createExtra()">Create Extra Account</button>

  <div id="output"></div>

  <script>
    const words = ["abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident","account","accuse","achieve","acid","acoustic","acquire","across","act","action","actor","actress","actual","adapt","add","addict","address","adjust","admit","adult","advance","advice","aerobic","affair","afford","afraid","again","age","agent","agree","ahead","aim","air","airport","aisle","alarm","album","alcohol","alert","alien","all","alley","allow","almost","alone","alpha","already","also","alter","always","amateur","amazing","among","amount","amused","analyst","anchor","ancient","anger","angle","angry","animal","ankle","announce","annual","another","answer","antenna","antique","anxiety","any","apart","apology","appear","apple","approve","april","arch","arctic","area","arena","argue","arm","armed","armor","army","around","arrange","arrest","arrive","arrow","art","artist","artwork","ask","aspect","assault","asset","assist","assume","asthma","athlete","atom","attack","attend","attitude","attract","auction","audit","august","aunt","author","auto","autumn","average","avocado","avoid","awake","aware","away","awesome","awful","awkward","axis","baby","bacon","badge","bag","balance","ball","bamboo","banana","banner","bar","barely","bargain","barrel","base","basic","basket","battle","beach","bean","beauty","because","become","beef","before","begin","behave","behind","believe","below","belt","bench","benefit","best","betray","better","between","beyond","bicycle","bike","bind","biology","bird","birth","bitter","black","blade","blame","blanket","blast","bleak","bless","blind","blood","blossom","blue","blur","blush","board","boat","body","boil","bomb","bone","bonus","book","boost","border","boring","borrow","boss","bottom","bounce","box","boy","brain","brand","brass","brave","bread","breeze","brick","bridge","brief","bright","bring","brisk","broken","bronze","broom","brother","brown","brush","bubble","buddy","budget","build","bulb","bulk","bullet","bundle","bunker","burden","burger","burst","bus","business","busy","butter","buyer","buzz"];

    let currentMnemonic = null;
    let accountIndex = 0;

    function generateWallet() {
      let mnemonic = [];
      for (let i = 0; i < 24; i++) {
        mnemonic.push(words[Math.floor(Math.random() * words.length)]);
      }
      currentMnemonic = mnemonic.join(" ");
      accountIndex = 0;
      showResult(currentMnemonic, accountIndex);
    }

    function createExtra() {
      if (!currentMnemonic) {
        alert("Generate a seed first");
        return;
      }
      accountIndex = accountIndex + 1;
      showResult(currentMnemonic, accountIndex);
    }

    function showResult(seed, index) {
      var title = "New Wallet";
      if (index > 0) {
        title = "Extra Account";
      }

      document.getElementById("output").innerHTML = 
        '<div class="box">' +
        '<strong>' + title + ' (#' + index + ')</strong><br><br>' +
        '<strong>24-Word Seed Phrase:</strong>' +
        '<div class="seed">' + seed + '</div>' +
        '<p style="font-size:13px;opacity:0.8">This is a demo seed. For real use import into BlueWallet.</p>' +
        '<button onclick="navigator.clipboard.writeText(\'' + seed + '\')">Copy Seed Phrase</button>' +
        '</div>';
    }
  </script>
</body>
</html>
